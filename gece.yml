name: Arama dizinini güncelle

on:
  schedule:
    - cron: '15 * * * *'      # her saat başı (:15'te)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Dosyaları klasörlere diz
        run: |
          mkdir -p sync magaza
          for f in sync.py satis.json; do if [ -f "$f" ]; then cp "$f" sync/; fi; done
          for f in akilli-arama.js panel-yukleyici.html; do if [ -f "$f" ]; then cp "$f" magaza/; fi; done
          ls sync magaza
      - name: Vektör önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: onbellek
          key: vektor-${{ github.run_id }}
          restore-keys: vektor-
      - name: ikas'tan ürünleri çek, dizini üret
        run: python sync/sync.py
        env:
          IKAS_MAGAZA: ${{ secrets.IKAS_MAGAZA }}
          IKAS_CLIENT_ID: ${{ secrets.IKAS_CLIENT_ID }}
          IKAS_CLIENT_SECRET: ${{ secrets.IKAS_CLIENT_SECRET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Depoyu canlı tut
        if: github.event_name == 'schedule'
        run: |
          son=$(git log -1 --format=%ct)
